# فحص تلقائي مع كل push و pull request: lint + typecheck + اختبارات الـ API (Postgres + Redis حقيقيان) + بناء + صور Docker
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  checks:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @miss-ann/api exec prisma generate
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm --filter @miss-ann/api build
      - run: pnpm --filter @miss-ann/web build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  test:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: missann
          # مثل التطوير والإنتاج: جلسات القاعدة بتوقيت القاهرة (الأعمدة UTC)
          TZ: Africa/Cairo
          PGTZ: Africa/Cairo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/missann?schema=public
      REDIS_URL: redis://localhost:6379
      # أسرار اختبار فقط (ليست أسرار الإنتاج)
      JWT_ACCESS_SECRET: ci_access_secret_for_tests_only_0123456789
      JWT_REFRESH_SECRET: ci_refresh_secret_for_tests_only_0123456789
      APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate + seed
        working-directory: apps/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm seed
      - name: Tests
        run: pnpm --filter @miss-ann/api test

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: missann-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: missann-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Validate compose file
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' deploy/.env
          docker compose -f docker-compose.prod.yml --env-file deploy/.env config --quiet
      - name: Smoke test API image
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=pg -e POSTGRES_DB=missann postgres:16
          docker run -d --name redis --network smoke redis:7.4-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          docker run -d --name api --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:pg@pg:5432/missann \
            -e REDIS_URL=redis://redis:6379 \
            -e APP_URL=https://ci.example \
            -e JWT_ACCESS_SECRET=$(openssl rand -hex 32) -e JWT_REFRESH_SECRET=$(openssl rand -hex 32) \
            missann-api:ci
          for i in $(seq 1 40); do curl -fsS localhost:3000/api/health && exit 0; sleep 2; done
          docker logs api; exit 1
