# nginx داخل صورة الواجهة: ملفات Vite الثابتة + تمرير /api للـ API (نفس المصدر ← لا CORS ولا مشاكل كوكي)
# أمامه Caddy (HTTPS تلقائي) — لذا X-Forwarded-Proto يُمرَّر كما جاء من Caddy.

map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # حد الرفع (حلول الواجبات حتى 15MB + هامش)؛ فيديو Bunny يُرفع مباشرة لـ Bunny لا عبرنا
  client_max_body_size 25m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

  # ── ترويسات أمان للواجهة (HSTS يضيفه Caddy مع HTTPS) ──
  # الفيديو: Bunny (iframe) ويوتيوب (iframe_api + nocookie)؛ رفع Bunny المباشر (TUS) من لوحة الأدمن؛
  # blob: لمعاينة ملفات الواجبات الخاصة؛ الدفع عبر تحويل كامل لصفحة Paymob (لا iframe)
  set $csp "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://video.bunnycdn.com; frame-src 'self' blob: https://iframe.mediadelivery.net https://www.youtube-nocookie.com https://www.youtube.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # ── الـ API ──
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 60s;
    # رفع الملفات يُمرَّر مباشرة (لا تخزين مؤقت على قرص nginx)
    proxy_request_buffering off;
  }

  # ── ملفات Vite ذات البصمة (الاسم يتغيّر مع كل بناء) ← تخزين سنة كاملة ──
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  # أيقونات وملفات public: يوم واحد
  location ~* \.(png|ico|webp|svg|woff2?|txt|webmanifest)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  # ── تطبيق الصفحة الواحدة: كل المسارات → index.html (بلا تخزين كي يصل البناء الجديد فوراً) ──
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp;
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()";
    add_header X-Frame-Options "DENY";
    try_files $uri /index.html;
  }
}
